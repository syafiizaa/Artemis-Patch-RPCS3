<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPCS3 Patch Merger</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2e3a;
    --text: #e0e0e0;
    --dim: #8888aa;
    --accent: #6c8cff;
    --accent2: #4ef0b0;
    --warn: #f0c040;
    --radius: 8px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.6;
  }
  .container { max-width: 900px; margin: 0 auto; padding: 24px 16px; }
  
  header {
    text-align: center;
    padding: 32px 0 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }
  header h1 { font-size: 1.8rem; font-weight: 600; letter-spacing: -0.5px; }
  header h1 span { color: var(--accent2); }
  header p { color: var(--dim); margin-top: 4px; font-size: 0.9rem; }

  .step { 
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 16px;
  }
  .step-title {
    font-size: 1rem;
    font-weight: 600;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .step-num {
    background: var(--accent2);
    color: #111;
    width: 26px; height: 26px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.8rem; font-weight: 700;
    flex-shrink: 0;
  }

  .file-drop {
    border: 2px dashed var(--border);
    border-radius: var(--radius);
    padding: 32px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
    background: var(--bg);
    margin-bottom: 12px;
  }
  .file-drop:hover, .file-drop.drag-over {
    border-color: var(--accent2);
    background: rgba(78,240,176,0.05);
  }
  .file-drop .icon { font-size: 2rem; margin-bottom: 8px; }
  .file-drop p { font-size: 0.85rem; color: var(--dim); }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 8px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    font-size: 0.85rem;
    font-weight: 500;
    transition: all 0.2s;
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--accent); color: #fff; }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .btn.primary:hover { opacity: 0.9; }
  .btn.success { background: var(--accent2); border-color: var(--accent2); color: #111; font-weight: 600; }
  .btn.success:hover { opacity: 0.9; }
  .btn.danger { background: transparent; border-color: #ff6b6b; color: #ff6b6b; font-weight: 600; }
  .btn.danger:hover { background: rgba(255,107,107,0.1); }
  .btn.sm { padding: 4px 10px; font-size: 0.75rem; }

  .file-list {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--bg);
    max-height: 300px;
    overflow-y: auto;
  }
  .file-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
    gap: 10px;
  }
  .file-item:last-child { border-bottom: none; }
  .file-name { font-weight: 600; word-break: break-all; flex: 1; }

  pre {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    font-family: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
    font-size: 0.8rem;
    overflow-x: auto;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 400px;
    overflow-y: auto;
    color: var(--accent2);
  }

  .hidden { display: none !important; }

  .summary {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 16px;
    line-height: 1.8;
    font-size: 0.9rem;
  }
  .summary span { font-weight: 600; }

  .dup-list {
    max-height: 200px;
    overflow-y: auto;
    font-size: 0.8rem;
    color: var(--dim);
    margin-top: 8px;
  }
  .dup-item { padding: 2px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }

  .nav-btn {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    color: var(--dim);
    text-decoration: none;
    font-size: 0.8rem;
    font-weight: 500;
    transition: all 0.2s;
  }
  .nav-btn:hover { border-color: var(--accent2); color: var(--text); }
  .nav-btn.active {
    background: rgba(78,240,176,0.12);
    border-color: var(--accent2);
    color: var(--accent2);
    cursor: default;
  }

  .icon-s { width: 14px; height: 14px; vertical-align: -2px; flex-shrink: 0; display: inline; }
  .icon-m { width: 22px; height: 22px; vertical-align: -5px; flex-shrink: 0; display: inline; }

  .footer {
    text-align: center;
    padding: 24px;
    color: var(--dim);
    font-size: 0.8rem;
  }
</style>
</head>
<body>
<div class="container">

<header>
  <h1>RPCS3 <span>Patch Merger</span></h1>
  <p>Gabung multiple <code>patch.yml</code> dari game berbeda → 1 file</p>
  <nav style="margin-top:12px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
    <a href="artemis-to-rpcs3.html" class="nav-btn"><svg class="icon-s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg> Converter</a>
    <span class="nav-btn active"><svg class="icon-s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 9v9a3 3 0 0 0 3 3h6"/></svg> Patch Merger</span>
  </nav>
</header>

<!-- Step 1: Upload -->
<div class="step">
  <div class="step-title"><span class="step-num">1</span> Upload patch.yml Files</div>
  <div class="file-drop" id="dropZone">
    <div class="icon"><svg class="icon-m" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-1L9 3.3A2 2 0 0 0 7.3 2H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2Z"/></svg></div>
    <p>Click or drop <code>.yml</code> files here</p>
    <p style="font-size:0.75rem;color:var(--dim)">Bisa upload banyak file sekaligus</p>
  </div>
  <input type="file" id="fileInput" accept=".yml,.yaml" multiple class="hidden">
  
  <div class="file-list hidden" id="fileList"></div>
  <div style="margin-top:10px;display:flex;gap:8px;align-items:center">
    <span style="font-size:0.8rem;color:var(--dim)" id="fileCount">Belum ada file</span>
    <button class="btn sm danger hidden" id="btnClear"><svg class="icon-s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg> Clear All</button>
  </div>
</div>

<!-- Step 2: Merge -->
<div class="step hidden" id="step2">
  <div class="step-title"><span class="step-num">2</span> Merge & Download</div>
  
  <div class="summary hidden" id="summary"></div>
  
  <div style="display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap">
    <button class="btn primary" id="btnMerge"><svg class="icon-s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 4V2m0 14v-2M8 9h2m10 0h2M17.8 11.8 19 13m-10-6 1.2 1.2M3 21l9-9m-2 2 4 4"/></svg> Merge patch.yml</button>
    <button class="btn success hidden" id="btnDownload"><svg class="icon-s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Download patch.yml</button>
    <button class="btn hidden" id="btnCopy"><svg class="icon-s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy</button>
  </div>
  <pre id="preview" class="hidden"></pre>
</div>

<div class="footer">
  RPCS3 Patch Merger • v2.0 • <span id="statusText">Upload file untuk memulai</span>
</div>

</div>

<script>
// ── SVG Icons (Lucide-style, currentColor) ──
const I = {
  folder:  '<svg class="icon-m" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-1L9 3.3A2 2 0 0 0 7.3 2H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2Z"/></svg>',
  target:  '<svg class="icon-s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></svg>',
  merge:   '<svg class="icon-s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 9v9a3 3 0 0 0 3 3h6"/></svg>',
  x:       '<svg class="icon-s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>',
  wand:    '<svg class="icon-s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 4V2m0 14v-2M8 9h2m10 0h2M17.8 11.8 19 13m-10-6 1.2 1.2M3 21l9-9m-2 2 4 4"/></svg>',
  copy:    '<svg class="icon-s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>',
  download:'<svg class="icon-s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>',
  alert:   '<svg class="icon-s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.7 17.3-9-15.6a1.4 1.4 0 0 0-2.4 0l-9 15.6A1.4 1.4 0 0 0 2.5 19h19a1.4 1.4 0 0 0 1.2-1.7Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  check:   '<svg class="icon-s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 6 11 17l-6-6"/></svg>',
  skip:    '<svg class="icon-s" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="13 17 18 12 13 7"/><polyline points="6 17 11 12 6 7"/></svg>',
};
// ─────────────────────────────────────────

const $ = id => document.getElementById(id);
const dropZone = $('dropZone');
const fileInput = $('fileInput');
const fileList = $('fileList');
const fileCount = $('fileCount');
const btnClear = $('btnClear');
const step2 = $('step2');
const summary = $('summary');
const btnMerge = $('btnMerge');
const btnDownload = $('btnDownload');
const btnCopy = $('btnCopy');
const preview = $('preview');
const statusText = $('statusText');

let files = []; // {name, content, ppuBlocks: [{hash, patchName, rawBlock}]}

// ---- File Upload ----
dropZone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', handleFiles);
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  if (e.dataTransfer.files.length) addFiles(Array.from(e.dataTransfer.files));
});

function handleFiles(e) {
  if (e.target.files.length) addFiles(Array.from(e.target.files));
}

// ---- Parse patch.yml into blocks ----
function extractBlocks(text) {
  const blocks = [];
  const lines = text.split('\n');
  let currentHash = null;
  let currentName = null;
  let blockStart = -1;
  let version = '';
  
  // Helper: tutup block yang sedang dikumpulkan
  function closePendingBlock(endIdx) {
    if (currentHash && currentName && blockStart >= 0) {
      const rawBlock = lines.slice(blockStart, endIdx).join('\n');
      blocks.push({ hash: currentHash, name: currentName, raw: rawBlock });
      currentName = null;
      blockStart = -1;
    }
  }
  
  for (let i = 0; i < lines.length; i++) {
    const line = lines[i];
    
    // Version line
    if (i === 0 && line.startsWith('Version:')) {
      version = line.replace('Version:', '').trim();
      continue;
    }
    
    // PPU hash — tutup block sebelumnya dulu sebelum ganti hash
    const ppuMatch = line.match(/^(PPU-[a-f0-9]{40}):/);
    if (ppuMatch) {
      closePendingBlock(i);
      currentHash = ppuMatch[1];
      continue;
    }
    
    // Anchors section — tutup block sebelumnya, lalu skip
    if (line.match(/^Anchors:/)) {
      closePendingBlock(i);
      currentHash = null;
      continue;
    }
    
    // Patch name (2-space indent)
    const nameMatch = line.match(/^  "([^"]+)":\s*$/);
    if (nameMatch && currentHash) {
      // Close previous block
      closePendingBlock(i);
      currentName = nameMatch[1];
      blockStart = i;
    }
  }
  
  // Tutup block terakhir
  closePendingBlock(lines.length);
  
  return { version, blocks };
}

async function addFiles(newFiles) {
  for (const f of newFiles) {
    if (!f.name.endsWith('.yml') && !f.name.endsWith('.yaml')) continue;
    const text = await f.text();
    const { version, blocks } = extractBlocks(text);
    files.push({ name: f.name, version, blocks, ppuCount: new Set(blocks.map(b => b.hash)).size });
  }
  renderFileList();
}

function removeFile(idx) {
  files.splice(idx, 1);
  renderFileList();
}

btnClear.addEventListener('click', () => {
  files = [];
  renderFileList();
});

function renderFileList() {
  if (files.length === 0) {
    fileList.classList.add('hidden');
    btnClear.classList.add('hidden');
    step2.classList.add('hidden');
    fileCount.textContent = 'Belum ada file';
    return;
  }
  
  fileList.classList.remove('hidden');
  btnClear.classList.remove('hidden');
  step2.classList.remove('hidden');
  fileCount.textContent = `${files.length} file diunggah`;
  
  fileList.innerHTML = files.map((f, i) => `
    <div class="file-item">
      <span class="file-name">${escHtml(f.name)}</span>
      <span style="color:var(--dim);font-size:0.75rem;flex-shrink:0">${f.ppuCount} PPU · ${f.blocks.length} patch</span>
      <button class="btn sm danger" onclick="removeFile(${i})">${I.x}</button>
    </div>
  `).join('');
}

// ---- Merge ----
btnMerge.addEventListener('click', () => {
  if (files.length < 2) {
    statusText.innerHTML = `${I.alert} Minimal 2 file untuk di-merge!`;
    return;
  }
  
  // Collect all blocks, skip duplicates by (hash, name)
  const seen = new Set();
  const mergedBlocks = []; // {hash, name, raw, srcFile}
  const skipped = [];
  let total = 0;
  
  for (const file of files) {
    for (const block of file.blocks) {
      total++;
      const key = `${block.hash}|${block.name.toLowerCase()}`;
      if (seen.has(key)) {
        skipped.push({ hash: block.hash, name: block.name, file: file.name });
        continue;
      }
      seen.add(key);
      mergedBlocks.push({ ...block, srcFile: file.name });
    }
  }
  
  // Group by PPU hash
  const byHash = {};
  for (const b of mergedBlocks) {
    if (!byHash[b.hash]) byHash[b.hash] = [];
    byHash[b.hash].push(b);
  }
  
  // Generate YAML
  let yml = 'Version: 1.2\n\n';
  
  for (const [hash, blocks] of Object.entries(byHash)) {
    yml += `${hash}:\n`;
    for (const b of blocks) {
      // trimEnd() — jangan hapus leading spaces (indentasi 2 spasi wajib!)
      yml += `${b.raw.trimEnd()}\n\n`;
    }
  }
  
  // Show summary
  summary.classList.remove('hidden');
  summary.innerHTML = `
    <span style="color:var(--accent2)">${I.check} Merge berhasil!</span><br>
    Total patch: <span>${total}</span> ·
    Digabung: <span style="color:var(--accent2)">${mergedBlocks.length}</span> ·
    <span style="color:var(--warn)">Duplikat: ${skipped.length}</span>
    ${skipped.length > 0 ? `
      <div class="dup-list">
        ${skipped.map(s => `<div class="dup-item">${I.skip} <b>${escHtml(s.name)}</b> (${s.hash.slice(0,12)}...) ← ${escHtml(s.file)}</div>`).join('')}
      </div>
    ` : ''}
  `;
  
  preview.textContent = yml;
  preview.classList.remove('hidden');
  btnDownload.classList.remove('hidden');
  btnCopy.classList.remove('hidden');
  
  window._mergedYml = yml;
  statusText.innerHTML = `${I.check} ${mergedBlocks.length} patch dari ${files.length} file berhasil digabung`;
});

// ---- Download / Copy ----
btnDownload.addEventListener('click', () => {
  if (!window._mergedYml) return;
  const blob = new Blob([window._mergedYml], {type: 'application/x-yaml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'patch.yml';
  a.click();
  URL.revokeObjectURL(url);
  statusText.innerHTML = `${I.download} Downloaded!`;
});

btnCopy.addEventListener('click', () => {
  if (!window._mergedYml) return;
  navigator.clipboard.writeText(window._mergedYml).then(() => {
    statusText.innerHTML = `${I.copy} Copied to clipboard!`;
  }).catch(() => {
    statusText.innerHTML = `${I.alert} Gagal copy, coba manual select`;
  });
});

function escHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

statusText.textContent = 'Upload patch.yml files untuk memulai';
</script>
</body>
</html>
